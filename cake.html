<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Little Reminder</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- LIBRARIES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

    <style>
        :root {
            /* Palette */
            --bg-gradient: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e9d5ff 100%);
            --color-text-main: #4c1d95;
            --color-text-body: #6b21a8;
            --color-accent: #db2777;
            --color-card-bg: rgba(255, 255, 255, 0.85);

            /* Typography */
            --font-cursive: 'Great Vibes', cursive;
            --font-ui: 'Poppins', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* -------------------------------------------------- */
        /* BACKGROUND EMOJIS                                  */
        /* -------------------------------------------------- */
        .emoji-bg {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            filter: blur(1px);
            z-index: 0;
            user-select: none;
            pointer-events: none;
        }

        /* -------------------------------------------------- */
        /* MAIN CONTAINERS                                    */
        /* -------------------------------------------------- */
        .container {
            z-index: 10;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* -------------------------------------------------- */
        /* CAKE SECTION                                       */
        /* -------------------------------------------------- */
        .cake-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cake-wrapper:hover {
            transform: scale(1.05);
        }

        .cake-wrapper:active {
            transform: scale(0.95);
        }

        svg#cake-svg {
            width: 280px;
            height: 280px;
            overflow: visible;
        }

        .instruction {
            margin-top: 1rem;
            font-family: var(--font-cursive);
            font-size: 2rem;
            color: var(--color-text-main);
            opacity: 0.8;
            animation: bounce 2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(219, 39, 119, 0.2);
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* -------------------------------------------------- */
        /* LETTER SECTION                                     */
        /* -------------------------------------------------- */
        .letter-card {
            width: 90%;
            max-width: 500px;
            background: var(--color-card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow:
                0 10px 30px -5px rgba(76, 29, 149, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            text-align: center;
            display: none;
            /* Hidden initially */
            opacity: 0;
            transform: scale(0.9);
            position: absolute;
            /* Stacked */
        }

        .typed-content {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            color: var(--color-text-main);
            line-height: 1.8;
            min-height: 180px;
            /* Prevent layout shift */
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .typed-cursor {
            color: var(--color-accent);
        }

        .btn-next {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: white;
            background: linear-gradient(90deg, #db2777, #9333ea);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            text-decoration: none;
        }

        .btn-next.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.4);
        }

        /* -------------------------------------------------- */
        /* RESPONSIVE                                         */
        /* -------------------------------------------------- */
        @media (max-width: 600px) {
            svg#cake-svg {
                width: 220px;
                height: 220px;
            }

            .instruction {
                font-size: 1.8rem;
            }

            .letter-card {
                padding: 2.5rem 1.5rem;
                width: 88%;
            }

            .typed-content {
                font-size: 1.1rem;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Emojis -->
    <div class="emoji-bg" style="top: 10%; left: 10%;">🎂</div>
    <div class="emoji-bg" style="top: 20%; right: 15%;">✨</div>
    <div class="emoji-bg" style="bottom: 15%; left: 20%;">🌸</div>
    <div class="emoji-bg" style="bottom: 25%; right: 10%;">💫</div>
    <div class="emoji-bg" style="top: 50%; left: 5%;">💖</div>
    <div class="emoji-bg" style="top: 15%; right: 40%;">😊</div>

    <div class="container">

        <!-- CAKE SECTION -->
        <div class="cake-wrapper" id="cake-section">
            <svg id="cake-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Glow -->
                <circle cx="100" cy="110" r="70" fill="#fbcfe8" fill-opacity="0.4" filter="blur(15px)" />

                <!-- Plate -->
                <ellipse cx="100" cy="150" rx="70" ry="15" fill="#e5e7eb" />
                <ellipse cx="100" cy="148" rx="70" ry="15" fill="#f3f4f6" />

                <!-- Cake Base -->
                <path d="M50 110 L50 140 Q100 160 150 140 L150 110" fill="#f9a8d4" stroke="#db2777" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
                <ellipse cx="100" cy="110" rx="50" ry="15" fill="#fbcfe8" />

                <!-- Cake Top Layer -->
                <path d="M55 85 L55 110 Q100 125 145 110 L145 85" fill="#f472b6" stroke="#db2777" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
                <ellipse cx="100" cy="85" rx="45" ry="12" fill="#fce7f3" />

                <!-- Frosting Drips -->
                <path d="M55 85 Q65 100 75 88 Q85 100 95 86 Q105 100 115 88 Q125 100 135 86 Q140 95 145 85"
                    fill="#fff1f2" stroke="none" />

                <!-- Candles -->
                <g id="candles">
                    <rect x="85" y="65" width="4" height="20" fill="#fde047" rx="1" />
                    <rect x="100" y="60" width="4" height="25" fill="#a78bfa" rx="1" />
                    <rect x="115" y="65" width="4" height="20" fill="#60a5fa" rx="1" />

                    <!-- Flames -->
                    <path class="flame" d="M87 50 Q89 65 85 65 Q81 65 83 50" fill="#fb923c" />
                    <path class="flame" d="M102 45 Q104 60 100 60 Q96 60 98 45" fill="#fb923c" />
                    <path class="flame" d="M117 50 Q119 65 115 65 Q111 65 113 50" fill="#fb923c" />
                </g>
            </svg>
            <div class="instruction">Tap the cake 🎂</div>
        </div>

        <!-- LETTER SECTION -->
        <div class="letter-card" id="letter-card">
            <div class="typed-content"><span id="typed-text"></span></div>
            <a href="dua.html" class="btn-next" id="btn-next">One Last Thing</a>
        </div>

    </div>

    <script>
        // 1. Initial Float Animations
        gsap.to("#cake-section", {
            y: -15,
            duration: 2.5,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut"
        });

        gsap.to(".flame", {
            scale: 1.2,
            opacity: 0.8,
            duration: 0.8,
            repeat: -1,
            yoyo: true,
            stagger: 0.2,
            transformOrigin: "center bottom"
        });

        // Floating Emojis
        gsap.utils.toArray(".emoji-bg").forEach((emoji, i) => {
            gsap.to(emoji, {
                y: -100,
                x: i % 2 === 0 ? 30 : -30,
                rotation: 20,
                duration: 10 + Math.random() * 5,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                delay: i * 0.5
            });
        });

        // 2. Interaction
        const cakeSection = document.getElementById('cake-section');
        const letterCard = document.getElementById('letter-card');
        const btnNext = document.getElementById('btn-next');

        cakeSection.addEventListener('click', () => {
            // Timeline for transition
            const tl = gsap.timeline();

            // Animate Cake Out
            tl.to(cakeSection, {
                scale: 0.5,
                opacity: 0,
                duration: 0.8,
                ease: "back.in(1.7)",
                onComplete: () => {
                    cakeSection.style.display = 'none';
                    letterCard.style.display = 'block';
                }
            })
                // Blur Background slightly more
                .to(".emoji-bg", {
                    filter: "blur(4px)",
                    opacity: 0.1,
                    duration: 0.5
                }, "<")
                // Animate Letter In
                .to(letterCard, {
                    opacity: 1,
                    scale: 1,
                    duration: 0.8,
                    ease: "back.out(1.2)",
                    onComplete: startTyping
                });
        });

        // 3. Typed.js Logic
        function startTyping() {
            new Typed('#typed-text', {
                strings: [
                    "This is not a celebration.",
                    "It's a reminder.",
                    "That some friendships are protected by limits,^500\n guided by respect,^500\n and sustained by duā.",
                    "Friendship anniversary mubarak 🤍"
                ],
                typeSpeed: 45,
                backSpeed: 30,
                backDelay: 800,
                startDelay: 200,
                loop: false,
                showCursor: true,
                cursorChar: '|',
                onComplete: (self) => {
                    self.cursor.remove();
                    // Reveal Button
                    gsap.to(btnNext, {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        delay: 0.5,
                        onStart: () => {
                            btnNext.classList.add('visible');
                        }
                    });
                }
            });
        }
    </script>
</body>

</html>
